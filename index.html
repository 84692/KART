<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic Link</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .channel-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 2px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #888;
        }

        .channel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #51cf66;
        }

        .channel-dot.busy {
            background: #ff6b6b;
        }

        .channel-dot.sending {
            background: #4a9eff;
        }

        .turn-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .turn-control {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 2px;
            padding: 14px 16px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .turn-info {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: space-between;
        }

        .turn-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
        }

        .hand-btn {
            width: 100%;
            background: #1a1a1a;
            color: #e0e0e0;
            border: 1px solid #333;
            padding: 14px 16px;
            font-size: 14px;
            text-transform: none;
            letter-spacing: 0;
        }

        .hand-btn:hover {
            background: #2a2a2a;
            border-color: #444;
        }

        .hand-btn.active {
            background: #4a9eff;
            color: #0a0a0a;
            border-color: #4a9eff;
        }

        .turn-status {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            font-weight: 500;
        }

        .turn-status.mine {
            color: #51cf66;
        }

        .turn-status.theirs {
            color: #ff6b6b;
        }

        .waveform {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 3px;
            height: 32px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .wave-bar {
            width: 3px;
            background: #4a9eff;
            border-radius: 1px;
        }

        .feed {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 2px;
            padding: 16px;
            height: 320px;
            overflow-y: auto;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .feed-empty {
            color: #555;
            font-size: 13px;
            font-style: italic;
            margin: auto;
        }

        .bubble {
            max-width: 80%;
            padding: 10px 12px;
            border-radius: 2px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }

        .bubble.sent {
            align-self: flex-end;
            background: #2a2a2a;
            color: #e0e0e0;
        }

        .bubble.received {
            align-self: flex-start;
            background: #16324a;
            color: #cfe8ff;
        }

        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        textarea {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 12px;
            font-family: inherit;
            font-size: 14px;
            border-radius: 2px;
            outline: none;
            resize: none;
            min-height: 46px;
            max-height: 46px;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: #666;
        }

        button {
            padding: 12px 18px;
            background: #fff;
            color: #0a0a0a;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 2px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        button:hover {
            background: #e0e0e0;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        .speed-section {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 2px;
            padding: 14px 16px;
        }

        .speed-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .speed-label-row span {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #666;
        }

        .speed-value {
            font-size: 12px;
            color: #4a9eff;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #4a9eff;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #4a9eff;
            border: none;
            cursor: pointer;
        }

        .permission-prompt {
            text-align: center;
            padding: 24px 20px;
            background: #1a1a1a;
            border-radius: 2px;
            margin-bottom: 20px;
        }

        .permission-prompt p {
            font-size: 14px;
            margin-bottom: 16px;
            color: #aaa;
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 22px;
            }

            .feed {
                height: 280px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SONIC LINK</h1>
            <p>Comunicação sonora local</p>
        </div>

        <div id="permissionPrompt" class="permission-prompt">
            <p>Precisa de permissão para usar o microfone</p>
            <button id="requestPermBtn">Permitir microfone</button>
        </div>

        <div id="mainContent" style="display: none;">
            <div class="channel-status">
                <div class="channel-dot" id="channelDot"></div>
                <span id="channelText">Canal livre, escutando</span>
            </div>

            <div class="waveform" id="waveform"></div>

            <div class="feed" id="feed">
                <div class="feed-empty" id="feedEmpty">Nenhuma mensagem ainda</div>
            </div>

            <div class="input-row">
                <textarea id="messageInput" placeholder="Digite sua mensagem"></textarea>
                <button id="sendBtn">Enviar</button>
            </div>

            <div class="turn-control">
                <div class="turn-info">
                    <span class="turn-label">Status:</span>
                    <span class="turn-status mine" id="turnStatus">Vez</span>
                </div>
                <button id="handBtn" class="hand-btn">✋ Pedir vez</button>
            </div>

            <div class="speed-section">
                <div class="speed-label-row">
                    <span>Velocidade de transmissão</span>
                    <span class="speed-value" id="speedValue">Rápida</span>
                </div>
                <input type="range" id="speedSlider" min="0" max="100" value="65">
            </div>
        </div>
    </div>

    <script>
        class SonicCommunicator {
            constructor() {
                this.audioContext = null;
                this.mediaStream = null;
                this.analyser = null;
                this.hasPermission = false;

                this.freqToLetter = {};
                this.letterToFreq = {};
                this.START_FREQ = 600;
                this.END_FREQ = 800;
                // Sinal de "pedir vez": 2 frequências fixas e agudas
                // (3800/4200Hz), fora da faixa de letras e dos marcadores,
                // difíceis de confundir com ruído comum ou com a mensagem.
                this.HAND_FREQ_A = 3800;
                this.HAND_FREQ_B = 4200;

                this.isSending = false;
                this.oscilators = [];

                this.myTurn = true;
                this.handSeqBuffer = [];

                this.inMessage = false;
                this.currentTranscript = '';
                this.currentToneFreq = null;
                this.toneFrames = 0;
                this.silenceFrames = 0;

                this.speed = 65;
                this.updateSpeedTimings();

                this.initializeEventListeners();
                this.setupFrequencyMap();
                this.autoRequestPermission();
            }

            initializeEventListeners() {
                document.getElementById('sendBtn').addEventListener('click', () => this.sendMessage());
                document.getElementById('requestPermBtn').addEventListener('click', () => this.requestPermission());
                document.getElementById('handBtn').addEventListener('click', () => this.requestTurn());

                document.getElementById('messageInput').addEventListener('keydown', (e) => {
                    if (e.ctrlKey && e.key === 'Enter') {
                        this.sendMessage();
                    }
                });

                const slider = document.getElementById('speedSlider');
                slider.addEventListener('input', (e) => {
                    this.speed = parseInt(e.target.value);
                    this.updateSpeedTimings();
                });
            }

            updateSpeedTimings() {
                const t = this.speed / 100;
                this.toneDur = 0.25 - t * 0.17;
                this.gapDur = 0.12 - t * 0.08;

                const label = document.getElementById('speedValue');
                if (this.speed < 20) label.textContent = 'Muito confiável';
                else if (this.speed < 45) label.textContent = 'Normal';
                else if (this.speed < 75) label.textContent = 'Rápida';
                else label.textContent = 'Máxima (sensível a ruído)';
            }

            setupFrequencyMap() {
                const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ '.split('');
                letters.forEach((letter, i) => {
                    const freq = 1200 + i * 80;
                    this.freqToLetter[freq] = letter;
                    this.letterToFreq[letter] = freq;
                });
            }

            normalizeText(text) {
                const map = {
                    'Á':'A','À':'A','Â':'A','Ã':'A','Ä':'A',
                    'É':'E','È':'E','Ê':'E','Ë':'E',
                    'Í':'I','Ì':'I','Î':'I','Ï':'I',
                    'Ó':'O','Ò':'O','Ô':'O','Õ':'O','Ö':'O',
                    'Ú':'U','Ù':'U','Û':'U','Ü':'U',
                    'Ç':'C','Ñ':'N'
                };
                return text.toUpperCase().split('').map(c => map[c] || c).join('');
            }

            async autoRequestPermission() {
                await this.requestPermission();
            }

            async requestPermission() {
                try {
                    this.mediaStream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false
                        }
                    });
                    this.hasPermission = true;
                    document.getElementById('permissionPrompt').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                    this.setupAudioGraph();
                    this.startListeningLoop();
                } catch (error) {
                    console.error('Erro de permissão:', error);
                }
            }

            setupAudioGraph() {
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = this.audioContext.createMediaStreamSource(this.mediaStream);
                this.analyser = this.audioContext.createAnalyser();
                this.analyser.fftSize = 8192;
                this.analyser.smoothingTimeConstant = 0.2;
                source.connect(this.analyser);
            }

            startListeningLoop() {
                this.animateWaveform();
                this.processAudio();
            }

            setChannelState(state) {
                const dot = document.getElementById('channelDot');
                const text = document.getElementById('channelText');
                const sendBtn = document.getElementById('sendBtn');
                dot.className = 'channel-dot';

                if (state === 'sending') {
                    dot.classList.add('sending');
                    text.textContent = 'Transmitindo...';
                    sendBtn.disabled = true;
                } else if (state === 'receiving') {
                    dot.classList.add('busy');
                    text.textContent = 'Recebendo mensagem...';
                    sendBtn.disabled = true;
                } else {
                    text.textContent = 'Canal livre, escutando';
                    sendBtn.disabled = !this.myTurn;
                }
            }

            detectFrequency(dataArray) {
                const nyquist = this.audioContext.sampleRate / 2;
                const binWidth = nyquist / this.analyser.frequencyBinCount;

                let maxEnergy = 0;
                let maxBin = 0;

                const minBin = Math.floor(500 / binWidth);
                const maxBinLimit = Math.ceil(4500 / binWidth);

                for (let i = minBin; i < maxBinLimit && i < dataArray.length; i++) {
                    if (dataArray[i] > maxEnergy) {
                        maxEnergy = dataArray[i];
                        maxBin = i;
                    }
                }

                if (maxEnergy < 90) return null;
                return maxBin * binWidth;
            }

            matchTone(detectedFreq) {
                if (Math.abs(detectedFreq - this.START_FREQ) < 40) return 'START';
                if (Math.abs(detectedFreq - this.END_FREQ) < 40) return 'END';
                if (Math.abs(detectedFreq - this.HAND_FREQ_A) < 40) return 'HAND_A';
                if (Math.abs(detectedFreq - this.HAND_FREQ_B) < 40) return 'HAND_B';

                let closestLetter = null;
                let minDiff = 40;

                for (let letter in this.letterToFreq) {
                    const diff = Math.abs(detectedFreq - this.letterToFreq[letter]);
                    if (diff < minDiff) {
                        minDiff = diff;
                        closestLetter = letter;
                    }
                }

                return closestLetter;
            }

            processAudio() {
                if (this.isSending) {
                    setTimeout(() => this.processAudio(), 40);
                    return;
                }

                const dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                this.analyser.getByteFrequencyData(dataArray);

                const detectedFreq = this.detectFrequency(dataArray);

                if (detectedFreq) {
                    const tone = this.matchTone(detectedFreq);

                    if (tone && tone !== this.currentToneFreq) {
                        this.toneFrames++;
                        if (this.toneFrames >= 2) {
                            this.registerTone(tone);
                            this.currentToneFreq = tone;
                            this.toneFrames = 0;
                        }
                    } else if (tone === this.currentToneFreq) {
                        this.toneFrames = 0;
                    }
                    this.silenceFrames = 0;
                } else {
                    this.silenceFrames++;
                    if (this.silenceFrames > 1) {
                        this.currentToneFreq = null;
                        this.toneFrames = 0;
                    }
                }

                setTimeout(() => this.processAudio(), 40);
            }

            registerTone(tone) {
                if (tone === 'HAND_A' || tone === 'HAND_B') {
                    this.handSeqBuffer.push(tone);
                    if (this.handSeqBuffer.length > 3) this.handSeqBuffer.shift();

                    if (this.handSeqBuffer.join(',') === 'HAND_A,HAND_B,HAND_A') {
                        this.handSeqBuffer = [];
                        this.onHandSignalReceived();
                    }
                    return;
                }
                this.handSeqBuffer = [];

                if (tone === 'START') {
                    this.inMessage = true;
                    this.currentTranscript = '';
                    this.setChannelState('receiving');
                    return;
                }

                if (tone === 'END') {
                    if (this.inMessage) {
                        this.inMessage = false;
                        if (this.currentTranscript.trim()) {
                            this.addBubble(this.currentTranscript, 'received');
                        }
                        this.setChannelState('idle');
                    }
                    return;
                }

                if (this.inMessage) {
                    this.currentTranscript += tone;
                }
            }

            // O outro dispositivo pediu a vez: bloqueia meu envio até eu
            // também apertar a mão, devolvendo a vez para ele decidir de novo.
            onHandSignalReceived() {
                this.myTurn = false;
                document.getElementById('sendBtn').disabled = true;
                const status = document.getElementById('turnStatus');
                status.textContent = 'Na escuta';
                status.className = 'turn-status theirs';
            }

            animateWaveform() {
                const waveform = document.getElementById('waveform');
                if (!this.analyser) {
                    requestAnimationFrame(() => this.animateWaveform());
                    return;
                }

                waveform.innerHTML = '';
                const dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                this.analyser.getByteFrequencyData(dataArray);

                for (let i = 0; i < 20; i++) {
                    const bar = document.createElement('div');
                    bar.className = 'wave-bar';
                    const idx = Math.floor((i / 20) * (dataArray.length * 0.15));
                    const height = Math.max(2, (dataArray[idx] / 255) * 32);
                    bar.style.height = height + 'px';
                    waveform.appendChild(bar);
                }

                requestAnimationFrame(() => this.animateWaveform());
            }

            sendMessage() {
                if (this.isSending || this.inMessage) return;

                const raw = document.getElementById('messageInput').value.trim();
                if (!raw) return;

                const message = this.normalizeText(raw);
                document.getElementById('messageInput').value = '';

                const bubbleId = this.addBubble(raw, 'sent');
                document.getElementById('messageInput').focus();

                this.transmit(message, bubbleId);
            }

            // Envia o sinal sonoro de "pedir vez". A escuta é pausada
            // automaticamente durante a transmissão (mesmo lock do isSending),
            // então o próprio pedido nunca é interpretado como recebido.
            requestTurn() {
                if (this.isSending || this.inMessage) return;

                const handBtn = document.getElementById('handBtn');
                const status = document.getElementById('turnStatus');

                this.isSending = true;
                handBtn.classList.add('active');
                status.textContent = 'Pedindo vez';
                status.className = 'turn-status';
                this.setChannelState('sending');

                if (this.audioContext.state === 'suspended') {
                    this.audioContext.resume();
                }

                const totalDuration = this.playHandSignal();

                setTimeout(() => {
                    this.isSending = false;
                    this.myTurn = true;
                    handBtn.classList.remove('active');
                    status.textContent = 'Vez';
                    status.className = 'turn-status mine';
                    this.setChannelState('idle');
                }, totalDuration + 150);
            }

            playHandSignal() {
                const DUR = 0.09;
                const GAP = 0.03;
                let time = this.audioContext.currentTime;

                const playTone = (freq) => {
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(this.audioContext.destination);

                    osc.type = 'square';
                    osc.frequency.setValueAtTime(freq, time);

                    gain.gain.setValueAtTime(0, time);
                    gain.gain.linearRampToValueAtTime(0.25, time + 0.005);
                    gain.gain.setValueAtTime(0.25, time + DUR - 0.01);
                    gain.gain.linearRampToValueAtTime(0, time + DUR);

                    osc.start(time);
                    osc.stop(time + DUR + 0.01);
                    this.oscilators.push(osc);

                    time += DUR + GAP;
                };

                [this.HAND_FREQ_A, this.HAND_FREQ_B, this.HAND_FREQ_A].forEach(playTone);

                return (time - this.audioContext.currentTime) * 1000;
            }

            transmit(message, bubbleId) {
                this.isSending = true;
                this.setChannelState('sending');

                if (this.audioContext.state === 'suspended') {
                    this.audioContext.resume();
                }

                const totalDuration = this.generateSound(message);

                setTimeout(() => {
                    this.isSending = false;
                    this.setChannelState('idle');
                }, totalDuration + 150);
            }

            generateSound(message) {
                const TONE_DUR = this.toneDur;
                const GAP_DUR = this.gapDur;
                let time = this.audioContext.currentTime;

                const playTone = (freq) => {
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(this.audioContext.destination);

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, time);

                    gain.gain.setValueAtTime(0, time);
                    gain.gain.linearRampToValueAtTime(0.3, time + 0.01);
                    gain.gain.setValueAtTime(0.3, time + TONE_DUR - 0.02);
                    gain.gain.linearRampToValueAtTime(0, time + TONE_DUR);

                    osc.start(time);
                    osc.stop(time + TONE_DUR + 0.02);
                    this.oscilators.push(osc);

                    time += TONE_DUR + GAP_DUR;
                };

                playTone(this.START_FREQ);
                message.split('').forEach(char => {
                    const freq = this.letterToFreq[char];
                    if (freq) playTone(freq);
                });
                playTone(this.END_FREQ);

                return (time - this.audioContext.currentTime) * 1000;
            }

            addBubble(text, type) {
                const feed = document.getElementById('feed');
                const empty = document.getElementById('feedEmpty');
                if (empty) empty.remove();

                const bubble = document.createElement('div');
                const id = 'b' + Date.now() + Math.random().toString(36).slice(2, 7);
                bubble.id = id;
                bubble.className = 'bubble ' + type;
                bubble.textContent = text;

                feed.appendChild(bubble);
                feed.scrollTop = feed.scrollHeight;
                return id;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new SonicCommunicator();
        });
    </script>
</body>
</html>
